name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # No install step: the project has no dependencies, which the suite itself
      # asserts (tests/fitness.test.js).
      # Deliberately `npm test`, not the underlying command: CI verifies the
      # exact line the README tells a reviewer to run.
      - name: Run the test suite
        working-directory: demo
        run: npm test
